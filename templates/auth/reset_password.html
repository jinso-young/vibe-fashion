{% extends "base.html" %}

{% block title %}새 비밀번호 설정 | VIBE-FASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-body p-4 p-md-5">
                    <!-- 헤더 -->
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-light text-dark d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h2 class="fw-black mb-1">새 비밀번호 설정</h2>
                        <p class="text-muted small">안전하게 사용할 새로운 비밀번호를 입력해주세요</p>
                    </div>

                    <!-- URL 파라미터 에러/성공 알림 메시지 (Bootstrap 5 Alert) -->
                    {% if error_message %}
                    <div class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2"></i> {{ error_message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button>
                    </div>
                    {% endif %}
                    {% if success_message %}
                    <div class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i> {{ success_message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button>
                    </div>
                    {% endif %}

                    <!-- 비밀번호 재설정 폼 -->
                    <form method="POST" action="{{ url_for('auth.reset_password') }}" id="resetPasswordForm">
                        <!-- 히든 토큰 필드 (URL 쿼리 파라미터 또는 해시 프래그먼트 자동 연동) -->
                        <input type="hidden" name="token_hash" id="token_hash" value="{{ token_hash or '' }}">
                        <input type="hidden" name="access_token" id="access_token" value="">
                        <input type="hidden" name="refresh_token" id="refresh_token" value="">

                        <div class="mb-3">
                            <label for="password" class="form-label small fw-bold">새 비밀번호</label>
                            <input type="password" class="form-control form-control-lg rounded-3 fs-6" 
                                   id="password" name="password" placeholder="영문, 숫자 포함 6자 이상" required minlength="6" autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password_confirm" class="form-label small fw-bold">새 비밀번호 확인</label>
                            <input type="password" class="form-control form-control-lg rounded-3 fs-6" 
                                   id="password_confirm" name="password_confirm" placeholder="새 비밀번호를 한 번 더 입력하세요" required minlength="6">
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-3 rounded-pill fw-bold shadow-sm">
                            <i class="bi bi-check-lg me-1"></i> 비밀번호 변경하기
                        </button>
                    </form>

                    <!-- 하단 로그인 안내 -->
                    <div class="text-center mt-4 pt-3 border-top small">
                        <a href="{{ url_for('auth.login') }}" class="text-muted text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i> 로그인 페이지로 이동
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Supabase Auth가 #access_token=...&refresh_token=... 해시 형태로 리다이렉트한 경우 자동 파싱
    document.addEventListener("DOMContentLoaded", function() {
        if (window.location.hash) {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const accessToken = hashParams.get("access_token");
            const refreshToken = hashParams.get("refresh_token");
            if (accessToken) {
                const atInput = document.getElementById("access_token");
                if (atInput) atInput.value = accessToken;
            }
            if (refreshToken) {
                const rtInput = document.getElementById("refresh_token");
                if (rtInput) rtInput.value = refreshToken;
            }
        }
    });
</script>
{% endblock %}
