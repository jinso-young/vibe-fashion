{% extends "base.html" %}

{% block title %}회원가입 | VIBE-FASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-body p-4 p-md-5">
                    <!-- 헤더 -->
                    <div class="text-center mb-4">
                        <span class="badge bg-light text-primary border px-3 py-1 rounded-pill fw-bold mb-2">JOIN US</span>
                        <h2 class="fw-black mb-1">회원가입</h2>
                        <p class="text-muted small">신규 회원가입 시 15% 즉시할인 쿠폰을 드립니다</p>
                    </div>

                    <!-- 소셜 간편 가입 -->
                    <div class="d-flex flex-column gap-2 mb-4">
                        <a href="{{ url_for('auth.social_login', provider='kakao') }}" 
                           class="btn d-flex align-items-center justify-content-center gap-2 py-2 fw-bold text-dark rounded-pill border-0 shadow-sm"
                           style="background-color: #FEE500; font-size: 0.95rem;">
                            <i class="bi bi-chat-fill fs-5" style="color: #381E1F;"></i>
                            카카오로 간편 가입하기
                        </a>
                        <a href="{{ url_for('auth.social_login', provider='naver') }}" 
                           class="btn d-flex align-items-center justify-content-center gap-2 py-2 fw-bold text-white rounded-pill border-0 shadow-sm"
                           style="background-color: #03C75A; font-size: 0.95rem;">
                            <span class="fw-black fs-6" style="font-family: sans-serif;">N</span>
                            네이버로 간편 가입하기
                        </a>
                    </div>

                    <!-- 구분선 -->
                    <div class="position-relative text-center my-4">
                        <hr class="text-muted opacity-25">
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted text-xs">또는 이메일 가입</span>
                    </div>

                    <!-- 회원가입 폼 -->
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-bold">이름 (닉네임)</label>
                            <input type="text" class="form-control form-control-lg rounded-3 fs-6" id="name" name="name" value="{{ name or '' }}" placeholder="홍길동" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-bold">이메일 주소</label>
                            <input type="email" class="form-control form-control-lg rounded-3 fs-6" id="email" name="email" value="{{ email or '' }}" placeholder="example@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-bold">비밀번호</label>
                            <input type="password" class="form-control form-control-lg rounded-3 fs-6" id="password" name="password" placeholder="영문, 숫자 포함 6자 이상" required minlength="6">
                        </div>
                        <div class="mb-3">
                            <label for="password_confirm" class="form-label small fw-bold">비밀번호 확인</label>
                            <input type="password" class="form-control form-control-lg rounded-3 fs-6" id="password_confirm" name="password_confirm" placeholder="비밀번호를 한 번 더 입력하세요" required minlength="6">
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="agreeTerms" required checked>
                            <label class="form-check-label text-muted small" for="agreeTerms">
                                <strong>이용약관</strong> 및 <strong>개인정보 처리방침</strong>에 동의합니다. (필수)
                            </label>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-3 rounded-pill fw-bold shadow-sm">
                            가입하기
                        </button>
                    </form>

                    <!-- 로그인 안내 -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <span class="text-muted small">이미 계정이 있으신가요?</span>
                        <a href="{{ url_for('auth.login') }}" class="fw-bold text-dark ms-1 small text-decoration-none border-bottom border-dark pb-1">
                            로그인하기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
